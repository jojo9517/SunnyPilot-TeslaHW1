name: prebuilt
on:
  push:
    branches: [ '**' ] # Triggers automatically on any branch push in your fork for testing
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  BUILD_SCRIPT: release/ci/docker_build_sp.sh

jobs:
  build_prebuilt:
    name: build prebuilt
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: true
    permissions:
      checks: read
      contents: read
      packages: write
    steps:
    # Step 1: Run repository checkout using your fork (LFS off initially)
    - uses: actions/checkout@v6
      with:
        submodules: true
        lfs: false
        token: ${{ secrets.GITHUB_TOKEN }}

    # Step 2: Inject the correct GitLab LFS endpoints into your workspace
    - name: Configure GitLab LFS Endpoints
      run: |
        # Completely remove all GitHub authentication headers to prevent leaking them to GitLab

        git config --global --unset-all http.https://github.com || true
        git config --unset-all http.https://github.com || true

        # Explicitly tell Git NOT to use any extra headers or credentials for GitLab
        git config --global http.https://com.extraheader ""

        # Set the main sunnypilot LFS endpoint
        git config lfs.url "https://gitlab.com"


    # Step 3: Fetch the assets from GitLab
    - name: Pull Sunnypilot LFS Assets
      run: |
        git lfs pull

    # Step 4: Fallback configuration for missing comma/openpilot elements if required
    - name: Pull Comma Openpilot LFS Assets (Fallback)
      run: |
        git config lfs.url "https://gitlab.com"
        git lfs pull || echo "No extra comma LFS objects needed or some skipped."

    # Step 5: Compile and publish the container to your GitHub Container Registry
    - name: Build and Push docker image
      run: |
        # The secret is fully accessible directly inside the run command block
        echo "${{ secrets.PREBUILD_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        chmod +x $BUILD_SCRIPT
        ./$BUILD_SCRIPT
