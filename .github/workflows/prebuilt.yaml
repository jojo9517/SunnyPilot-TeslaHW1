name: prebuilt
on:
  push:
    branches: [ '**' ] # Triggers automatically on any branch push in your fork for testing
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  DOCKER_LOGIN_CMD: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
  BUILD_SCRIPT: release/ci/docker_build_sp.sh

jobs:
  build_prebuilt:
    name: build prebuilt
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: true
    permissions:
      checks: read
      contents: read
      packages: write
    steps:
    # Step 1: Force Git LFS to pull assets directly from the upstream repository
    - name: Configure Git LFS Upstream URL
      run: |
        git config --global lfs.url "https://github.com"

    # Step 2: Run repository checkout
    - uses: actions/checkout@v6
      with:
        repository: 'P6g9YHK6/SunnyPilot-TeslaHW1' # Fetches code from the original repository base
        ref: ${{ github.ref_name }}                # Automatically resolves to your current active branch name
        submodules: true
        lfs: true                                  # Fetches LFS assets successfully using the upstream URL configured above
        token: ${{ secrets.GITHUB_TOKEN }}

    # Step 3: Compile and publish the container
    - name: Build and Push docker image
      run: |
        $DOCKER_LOGIN_CMD
        chmod +x $BUILD_SCRIPT
        ./$BUILD_SCRIPT

