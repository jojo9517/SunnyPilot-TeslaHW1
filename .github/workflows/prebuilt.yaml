name: prebuilt
on:
  push:
    branches: [ '**' ] # Triggers automatically on any branch push in your fork for testing
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  DOCKER_LOGIN_CMD: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
  BUILD_SCRIPT: release/ci/docker_build_sp.sh

jobs:
  build_prebuilt:
    name: build prebuilt
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: true
    permissions:
      checks: read
      contents: read
      packages: write
    steps:
    # Step 1: Run repository checkout using YOUR fork and YOUR active branch
    - uses: actions/checkout@v6
      with:
        submodules: true
        lfs: false # Disable LFS initialization during the initial checkout to prevent the 404 crash
        token: ${{ secrets.GITHUB_TOKEN }}

    # Step 2: Manually inject the upstream LFS URL into the local repository configuration
    - name: Configure Git LFS Upstream URL
      run: |
        git config lfs.url "https://github.com"

    # Step 3: Pull the LFS files directly from the working upstream server now that the path is redirected
    - name: Pull Git LFS Assets
      run: |
        git lfs pull

    # Step 4: Compile and publish the container
    - name: Build and Push docker image
      run: |
        $DOCKER_LOGIN_CMD
        chmod +x $BUILD_SCRIPT
        ./$BUILD_SCRIPT
