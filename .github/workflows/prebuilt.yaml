name: prebuilt
on:
  push:
    branches: [ '**' ] # Triggers automatically on any branch push in your fork for testing
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  BUILD_SCRIPT: release/ci/docker_build_sp.sh

jobs:
  build_prebuilt:
    name: build prebuilt
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: true
    permissions:
      checks: read
      contents: read
      packages: write
    steps:
    # Step 1: Run repository checkout using your fork (LFS off initially)
    - uses: actions/checkout@v6
      with:
        submodules: true
        lfs: false
        token: ${{ secrets.GITHUB_TOKEN }}

    # Step 2: Inject the correct GitLab LFS endpoints into your workspace
    # This specific block successfully fixed your LFS issue before
    - name: Configure GitLab LFS Endpoints
      run: |
        # Clear any potential token headers leaking into external networks
        git config --unset-all http.https://github.com || true

        # Set the main sunnypilot LFS endpoint
        git config lfs.url "https://gitlab.com/sunnypilot/public/sunnypilot-new-lfs.git/info/lfs"

    # Step 3: Fetch the assets from GitLab
    - name: Pull Sunnypilot LFS Assets
      run: |
        git lfs pull

    # Step 4: Fallback configuration for missing comma/openpilot elements if required
    - name: Pull Comma Openpilot LFS Assets (Fallback)
      run: |
        git config lfs.url "https://gitlab.com/commaai/openpilot-lfs.git/info/lfs"
        git lfs pull || echo "No extra comma LFS objects needed or some skipped."

    # Step 5: Compile and publish the container to your GitHub Container Registry
    # Fixed: Token authentication is now performed directly inside the run block
    - name: Build and Push docker image
      run: |
        echo "${{ secrets.PREBUILT_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        chmod +x $BUILD_SCRIPT
        ./$BUILD_SCRIPT
